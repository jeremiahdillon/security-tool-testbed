name: PR Build

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Comment result
        run: echo "PR ${{ github.event.pull_request.title }} built"
