id: sast-js-hardcoded-secret-001
category: sast
language: javascript
title: Hardcoded signing secrets in config
expected_summary: Central configuration module with defaults for local development.
notes: >
  Two hardcoded credentials used as cryptographic signing material. The JWT signing key has no
  env fallback at all. Overlaps with the secrets category but is planted here as a SAST
  hardcoded-credentials finding.
planted:
  - type: hardcoded-secret
    cwe: CWE-798
    severity: high
    file: cases/sast/js/taskflow/lib/config.js
    line: 11
    expected_tools: [sonar, codeql, coderabbit, endor, gitleaks]
    detail: session.secret default is a hardcoded signing key.
  - type: hardcoded-secret
    cwe: CWE-798
    severity: high
    file: cases/sast/js/taskflow/lib/config.js
    line: 15
    expected_tools: [sonar, codeql, coderabbit, endor, gitleaks]
    detail: jwt.signingKey is a hardcoded 64-hex secret with no env fallback.
