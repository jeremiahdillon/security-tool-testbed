notes: >
  A spread of fake-but-format-valid provider credentials so each scanner's provider-specific
  detector is exercised. All values are non-functional. SCORING NOTE: matching is greedy and
  one-to-one — each tool finding satisfies at most one planted entry (matched by file + type,
  ±line tolerance). Tools that report each secret separately (the norm for secret scanners)
  score correctly here; a tool that reports a single aggregated "secrets found in file" finding
  will match only one entry and be counted as missing the rest. That is intentional and honest,
  not a bug — see docs/architecture.md (scoring model).
