id: sast-js-hardcoded-secret-002
category: sast
language: javascript
title: Base64-encoded fallback token-signing key
expected_summary: Verifies HMAC-signed bearer tokens and guards routes behind them.
notes: >
  TOKEN_KEY falls back to a hardcoded base64 literal when the env var is unset, so every
  deployment without TOKEN_KEY shares a public signing key and tokens can be forged. The base64
  wrapping makes it less obvious than a raw hex/string literal; it re-tests the baseline gap
  where CodeRabbit missed sast-js-hardcoded-secret-001. The verify() logic itself is sound
  (timingSafeEqual with a length check), a control against noise.
planted:
  - type: hardcoded-secret
    cwe: CWE-798
    severity: high
    file: cases/sast/js/taskflow/lib/auth.js
    line: 5
    expected_tools: [sonar, codeql, coderabbit, gitleaks, aikido, gitar]
    detail: process.env.TOKEN_KEY || '<base64 literal>' used as the HMAC key.
