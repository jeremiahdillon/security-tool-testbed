id: sast-js-cmdi-001
category: sast
language: javascript
title: OS command injection in thumbnail generation
expected_summary: Generates a 128x128 thumbnail for an uploaded attachment.
notes: The :name path param flows into a shell command string passed to child_process.exec.
planted:
  - type: command-injection
    cwe: CWE-78
    severity: high
    file: cases/sast/js/taskflow/routes/attachments.js
    line: 14
    expected_tools: [sonar, codeql, coderabbit, endor, aikido, gitar]
    detail: req.params.name reaches exec() via an interpolated `convert` command.
  - type: path-traversal
    cwe: CWE-22
    severity: high
    file: cases/sast/js/taskflow/routes/attachments.js
    line: 12
    expected_tools: [sonar, codeql, endor, aikido, gitar]
    detail: req.params.name flows into path.join(UPLOAD_DIR, name) with no containment check.
