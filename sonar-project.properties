# SonarCloud analysis configuration.
#
# This project is analyzed via SonarCloud **Automatic Analysis** (no CI job or token required);
# the project/organization binding is configured in the SonarCloud UI. The settings below just
# tune what gets analyzed. (If you ever switch to CI-based analysis, use the token-gated
# .github/workflows/sonar.yml and add projectKey/organization here.)

# Analyze the corpus; the scoring harness fixtures and round outputs are tooling, not cases.
sonar.exclusions=scoring/fixtures/**,results/**
sonar.python.version=3.9
