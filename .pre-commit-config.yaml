# Pre-commit guardrails for the security testbed.
# Install locally with:  pip install pre-commit && pre-commit install
# These hooks are also run in CI (see .github/workflows/scoring.yml).
repos:
  - repo: local
    hooks:
      - id: guardrail-check
        name: Guardrail check (DO-NOT sync + no install artifacts)
        entry: python3 scoring/guardrail_check.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ground-truth-validate
        name: Validate ground-truth records against schema and source
        entry: python3 scoring/score.py --validate
        language: system
        pass_filenames: false
        always_run: true

      - id: leak-check
        name: Real-secret leak guard (planted fakes only; no real secrets)
        entry: python3 scoring/leak_check.py
        language: system
        pass_filenames: false
        always_run: true
