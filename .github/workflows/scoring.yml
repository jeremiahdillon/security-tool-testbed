name: Scoring & guardrails

# Runs the guardrail check, ground-truth validation, and harness self-test on every push/PR,
# and can score a round on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Transient review-sandbox PRs (from land-case-prs) only add review-sandbox/** copies of a
    # case; skip the guards for those so they don't false-fail on the copied planted secrets.
    paths-ignore:
      - "review-sandbox/**"
  workflow_dispatch:
    inputs:
      round_dir:
        description: "Round directory to score (e.g. results/2026-09-21). Leave blank to skip."
        required: false
        default: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness deps
        run: python3 -m pip install -r scoring/requirements.txt

      - name: Guardrail check (DO-NOT sync + no install artifacts + no giveaways in cases/)
        run: python3 scoring/guardrail_check.py

      - name: Real-secret leak guard (planted fakes only; no real secrets)
        run: python3 scoring/leak_check.py

      - name: Validate ground truth
        run: python3 scoring/score.py --validate

      - name: Harness self-test
        run: python3 scoring/score.py --self-test

      - name: Score round (optional)
        if: ${{ github.event.inputs.round_dir != '' }}
        # Pass the dispatch input via env, never interpolated into the shell, to avoid
        # workflow script injection (flagged by Aikido). $ROUND_DIR is quoted below.
        env:
          ROUND_DIR: ${{ github.event.inputs.round_dir }}
        run: |
          case "$ROUND_DIR" in
            results/*) : ;;
            *) echo "::error::round_dir must be under results/"; exit 1 ;;
          esac
          python3 scoring/score.py --round "$ROUND_DIR"

      - name: Upload round report
        if: ${{ github.event.inputs.round_dir != '' }}
        env:
          ROUND_DIR: ${{ github.event.inputs.round_dir }}
        uses: actions/upload-artifact@v4
        with:
          name: round-report
          path: ${{ env.ROUND_DIR }}/report.md
